name: Any Branch CI/CD with Approval

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: echo "build"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test
        run: echo "test"
        
  db-migration-staging:
    runs-on: ubuntu-latest
    needs: test
    environment: staging
    steps:
      - name: Run DB Migration
        run: echo "Run DB Migration to staging"
        
  deploy-staging:
    runs-on: ubuntu-latest
    needs: db-migration-staging
    environment: staging
    steps:
      - name: Deploy to staging
        run: echo "deploy to staging"

  post-deploy-test-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: staging
    steps:
      - name: Integration tests for staging
        run: echo "Integration tests for staging"        

  deploy-production:
    runs-on: ubuntu-latest
    needs: post-deploy-test-staging
    environment: production   # 👈 manual approval gate here
    steps:   
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify PR approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 👈 provide auth for gh CLI         
        # exit 78 marks the job as neutral/skipped instead of failing
        run: |
          # Ensure PR number is provided as input to workflow_dispatch or from context
          PR_NUMBER=${{ github.event.pull_request.number }}
          echo "Checking PR #$PR_NUMBER approval status..."
  
          # Query PR review status using GitHub CLI
          PR_STATUS=$(gh pr view $PR_NUMBER --json reviewDecision -q .reviewDecision)
  
          if [ "$PR_STATUS" != "APPROVED" ]; then
            echo "❌ PR #$PR_NUMBER has not been approved yet."
            echo "Please wait for reviewer approval and re-run this job."
            exit 78
          fi
  
      - name: Deploy to production
        run: |
          echo "✅ PR approved. Deploying PR #${{ github.event.pull_request.number }} to production..."
