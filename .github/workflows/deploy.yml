name: Any Branch CI/CD with Approval

on:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: echo "build"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test
        run: echo "test"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: test
    environment: staging
    steps:
      - name: Deploy to staging
        run: echo "deploy to staging"

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production   # 👈 approval gate here
    steps:
      - name: Deploy to production
        run: echo "deploy to production"
